<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>関数 ｙ＝ａχ² の基本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FCFBF4; --grid:#DDE7E3; --grid2:#EDF2EF;
    --ink:#37424A; --ink-soft:#6A757C;
    --red:#EA5040; --red-deep:#D33B2E;
    --blue:#2E9BD6; --blue-deep:#1F7CAE;
    --yellow:#F6B93B; --yellow-deep:#D89A2C;
    --green:#34B37A; --green-deep:#279862;
    --teal2:#1F8A70; --teal2-deep:#146754;
    --card:#FFFFFF;
    --shadow:0 6px 0 rgba(55,66,74,.10), 0 12px 28px rgba(55,66,74,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;font-family:"Zen Maru Gothic",system-ui,sans-serif;color:var(--ink);
    background:
      linear-gradient(var(--grid2) 1px,transparent 1px) 0 0/24px 24px,
      linear-gradient(90deg,var(--grid2) 1px,transparent 1px) 0 0/24px 24px,
      linear-gradient(var(--grid) 1px,transparent 1px) 0 0/120px 120px,
      linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/120px 120px,
      var(--paper);
    display:flex;align-items:flex-start;justify-content:center;min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  .app{width:100%;max-width:760px;padding:18px 16px 44px;}
  .num{font-family:"M PLUS Rounded 1c",sans-serif;}

  header.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo .pin{width:34px;height:34px;border-radius:50%;background:var(--teal2);color:#fff;font-weight:900;
    display:grid;place-items:center;font-size:13px;box-shadow:0 3px 0 var(--teal2-deep);transform:rotate(-8deg);}
  .logo b{font-size:17px;font-weight:900;}
  .who{display:flex;align-items:center;gap:6px;}
  .who .badge{background:var(--card);border-radius:999px;padding:6px 12px;font-weight:900;font-size:12px;
    box-shadow:0 3px 0 rgba(55,66,74,.10);color:var(--teal2);cursor:pointer;border:none;font-family:inherit;}
  .who .badge:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(55,66,74,.10);}
  .icon-btn{border:none;background:var(--card);border-radius:12px;width:44px;height:38px;font-size:16px;
    cursor:pointer;color:var(--ink);box-shadow:0 3px 0 rgba(55,66,74,.12);font-family:inherit;}
  .icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(55,66,74,.12);}

  .screen{display:none;animation:pop .3s ease;}
  .screen.active{display:block;}
  @keyframes pop{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  .title-card{background:var(--card);border-radius:26px;padding:26px 22px 20px;box-shadow:var(--shadow);
    text-align:center;position:relative;overflow:hidden;margin-bottom:16px;}
  .title-card::before{content:"";position:absolute;inset:8px;border:3px dashed #CCE3DC;border-radius:20px;pointer-events:none;}
  .title-card h1{margin:2px 0;font-size:clamp(21px,5.4vw,32px);font-weight:900;color:var(--teal2);
    position:relative;text-shadow:2px 3px 0 #D2E8E0;}
  .title-card h1 i{font-style:italic;}
  .title-card h1 sup{font-size:.55em;vertical-align:super;}
  .title-card .sub{color:var(--ink-soft);font-weight:700;font-size:14px;position:relative;}
  .prompt{position:relative;margin-top:10px;color:var(--blue);font-weight:900;font-size:14px;}

  .menu-head{display:flex;align-items:baseline;gap:10px;margin:2px 4px 12px;flex-wrap:wrap;}
  .menu-head h2{font-size:19px;font-weight:900;margin:0;}
  .menu-head p{margin:0;color:var(--ink-soft);font-weight:700;font-size:12px;}

  .mlist{display:grid;grid-template-columns:1fr;gap:11px;}
  .mcard{display:flex;align-items:center;gap:12px;background:var(--card);border:none;border-radius:16px;
    padding:16px 14px;box-shadow:var(--shadow);cursor:pointer;font-family:inherit;text-align:left;
    color:var(--ink);transition:transform .1s;}
  .mcard:hover{transform:translateY(-3px);}
  .mcard:active{transform:translateY(1px);box-shadow:0 3px 0 rgba(55,66,74,.10);}
  .mcard .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--teal2);color:#fff;font-weight:900;
    display:grid;place-items:center;font-size:14px;font-family:"M PLUS Rounded 1c";box-shadow:0 3px 0 var(--teal2-deep);}
  .mcard.rand .n{background:var(--yellow);box-shadow:0 3px 0 var(--yellow-deep);color:#6a5000;}
  .mcard.miss .n{background:var(--red);box-shadow:0 3px 0 var(--red-deep);}
  .mcard.blue .n{background:var(--blue);box-shadow:0 3px 0 var(--blue-deep);}
  .mcard .lbl{font-weight:900;font-size:15px;line-height:1.35;}
  .mcard .lbl i{font-style:italic;color:var(--teal2);}
  .mcard .lbl sup{font-size:.6em;vertical-align:super;}
  .mcard .sm{display:block;font-size:11px;color:var(--ink-soft);font-weight:700;margin-top:3px;}

  .foot{display:flex;justify-content:center;margin-top:18px;}
  .foot a,.foot button{display:inline-flex;align-items:center;gap:8px;font-weight:900;border:none;border-radius:16px;
    padding:12px 22px;font-size:15px;color:var(--ink);background:#fff;box-shadow:0 5px 0 rgba(55,66,74,.15);
    font-family:inherit;cursor:pointer;text-decoration:none;}
  .foot a:active,.foot button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(55,66,74,.15);}
  .credit{text-align:center;margin-top:14px;font-size:11px;color:#9AA4A9;line-height:1.7;}

  /* ---- play ---- */
  .play-top{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap;}
  .chip{background:var(--card);border-radius:999px;padding:6px 13px;font-weight:700;font-size:12px;box-shadow:0 3px 0 rgba(55,66,74,.10);}
  .chip.mode{color:var(--teal2);font-weight:900;}
  .back-btn{border:none;background:var(--card);border-radius:12px;padding:8px 13px;font-family:inherit;
    font-weight:700;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 rgba(55,66,74,.12);font-size:13px;}
  .back-btn:active{transform:translateY(2px);}
  .dots{display:flex;gap:5px;margin-left:auto;}
  .dot{width:15px;height:15px;border-radius:50%;background:#E4EAE8;display:grid;place-items:center;font-size:10px;color:#fff;font-weight:900;}
  .dot.ok{background:var(--green);} .dot.ng{background:var(--red);}
  .dot.now{background:var(--yellow);box-shadow:0 0 0 3px rgba(246,185,59,.35);}

  .board{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:24px 12px 18px;
    text-align:center;position:relative;overflow:hidden;min-height:210px;}
  .note{color:var(--blue);font-weight:900;font-size:13px;margin-bottom:12px;}
  .qline{margin:4px 0;}
  .qsub{font-family:"M PLUS Rounded 1c";font-weight:900;font-size:clamp(17px,4.4vw,23px);
    color:var(--ink-soft);margin-top:10px;}
  .qsub i{font-style:italic;color:var(--teal2);}
  .qsub b{color:var(--teal2-deep);}
  .answer-line{margin-top:14px;font-family:"M PLUS Rounded 1c";font-weight:900;
    font-size:clamp(20px,5.2vw,28px);display:flex;align-items:center;justify-content:center;gap:.14em;flex-wrap:wrap;}
  .answer-line .lb{font-family:"Zen Maru Gothic";color:var(--teal2);}
  .answer-line .lb i{font-style:italic;}
  .answer-line i{font-style:italic;color:var(--teal2);}
  .ansbox{min-width:3.2em;min-height:1.05em;padding:0 .16em;border-bottom:6px solid var(--blue);color:var(--blue);
    border-radius:6px 6px 4px 4px;display:inline-flex;align-items:flex-end;justify-content:center;background:rgba(46,155,214,.10);}
  .ansbox.blink{animation:bl 1s steps(2) infinite;}
  @keyframes bl{50%{border-bottom-color:transparent;}}
  .hintbtn{margin-top:12px;border:none;background:#E6F2EE;color:var(--teal2-deep);border-radius:999px;
    padding:7px 16px;font-family:inherit;font-weight:900;font-size:12px;cursor:pointer;box-shadow:0 3px 0 #C2DED5;}
  .hintbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #C2DED5;}
  .hintbox{display:none;margin-top:8px;background:#FDF0CF;color:#6a5000;border-radius:12px;
    padding:9px 12px;font-size:12px;font-weight:700;line-height:1.8;text-align:left;}
  .hintbox.show{display:block;}
  .hintbox i{font-style:italic;} .hintbox sup{font-size:.65em;vertical-align:super;}
  .msg{margin-top:8px;font-weight:900;font-size:17px;min-height:24px;}
  .msg.good{color:var(--green);} .msg.bad{color:var(--red);}
  .reveal{display:none;margin-top:6px;font-family:"M PLUS Rounded 1c";font-weight:900;font-size:20px;}
  .reveal.show{display:block;animation:pop .3s ease;}
  .reveal b{color:var(--red);}
  .reveal i{font-style:italic;} .reveal sup{font-size:.6em;vertical-align:super;}
  .reveal .step{margin-top:8px;font-size:15px;color:var(--ink-soft);line-height:1.9;}

  .stamp{position:absolute;top:50%;left:50%;pointer-events:none;}
  .stamp svg{display:block;width:126px;height:126px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.15));}
  .stamp.maru{animation:si .45s cubic-bezier(.2,1.5,.4,1) both;}
  .stamp.batsu{animation:sh .5s ease both;}
  @keyframes si{0%{transform:translate(-50%,-50%) scale(2.4) rotate(-25deg);opacity:0;}60%{opacity:1;}100%{transform:translate(-50%,-50%) scale(1) rotate(-8deg);opacity:1;}}
  @keyframes sh{0%{transform:translate(-50%,-50%) scale(1.4);opacity:0;}20%{opacity:1;}30%{transform:translate(-53%,-50%) rotate(-6deg);}45%{transform:translate(-47%,-50%) rotate(6deg);}60%{transform:translate(-52%,-50%) rotate(-4deg);}100%{transform:translate(-50%,-50%) rotate(0);opacity:1;}}

  .keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px;}
  .key{border:none;background:var(--card);border-radius:15px;padding:14px 0;font-family:"M PLUS Rounded 1c";
    font-weight:900;font-size:23px;color:var(--ink);cursor:pointer;box-shadow:0 5px 0 rgba(55,66,74,.14);}
  .key:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(55,66,74,.14);}
  .key.sign{color:var(--teal2-deep);background:#E6F2EE;box-shadow:0 5px 0 #C2DED5;}
  .key.sign:active{box-shadow:0 1px 0 #C2DED5;}
  .key.del{background:#FDECE9;color:var(--red);box-shadow:0 5px 0 #F3C4BC;font-size:19px;}
  .key.del:active{box-shadow:0 1px 0 #F3C4BC;}
  .key:disabled{opacity:.28;pointer-events:none;}
  .enter-btn{width:100%;margin-top:10px;border:none;cursor:pointer;font-family:inherit;font-weight:900;
    border-radius:16px;color:#fff;padding:14px 0;font-size:19px;background:var(--green);box-shadow:0 5px 0 var(--green-deep);}
  .enter-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--green-deep);}

  .formula-card{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:10px 18px;
    background:#fff;border-radius:16px;box-shadow:inset 0 0 0 3px #E6F2EE, 0 4px 0 rgba(55,66,74,.08);
    font-family:"M PLUS Rounded 1c";font-weight:900;font-size:clamp(26px,6.4vw,38px);color:var(--teal2-deep);}
  .formula-card i{font-style:italic;color:var(--teal2);}
  .formula-card sup{font-size:.52em;vertical-align:super;}

  /* ---- result ---- */
  .result-card{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:24px 18px 22px;text-align:center;}
  .hanamaru-wrap{height:120px;display:grid;place-items:center;}
  .score-line{font-weight:900;font-size:20px;margin:6px 0 2px;}
  .score-line .big{font-family:"M PLUS Rounded 1c";font-size:52px;color:var(--red);vertical-align:-5px;margin:0 4px;}
  .result-msg{font-weight:900;font-size:22px;margin:4px 0 6px;}
  .time-line{color:var(--ink-soft);font-weight:700;font-size:13px;margin-bottom:14px;}
  .hyouka{display:inline-flex;align-items:center;gap:8px;background:#E6F2EE;color:var(--teal2-deep);
    border-radius:999px;padding:8px 18px;font-weight:900;font-size:15px;margin-bottom:16px;}
  .hyouka .st{font-family:"M PLUS Rounded 1c";font-size:19px;}
  .review{display:flex;flex-direction:column;gap:7px;text-align:left;margin:0 auto 18px;max-width:520px;}
  .review-row{display:flex;align-items:center;gap:10px;background:#F7FAF9;border-radius:14px;padding:9px 12px;
    font-family:"M PLUS Rounded 1c";font-weight:900;font-size:14px;flex-wrap:wrap;}
  .review-row .rmark{width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:50%;font-size:14px;color:#fff;}
  .review-row .rmark.ok{background:var(--green);} .review-row .rmark.ng{background:var(--red);}
  .review-row .rq{flex:1;min-width:9em;}
  .review-row i{font-style:italic;} .review-row sup{font-size:.6em;vertical-align:super;}
  .review-row .ra.wrong{color:var(--red);text-decoration:line-through;margin-right:6px;}
  .review-row .rc{color:var(--green);}
  .kaiseki{max-width:520px;margin:0 auto 18px;text-align:left;}
  .result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .big-btn{border:none;cursor:pointer;font-family:inherit;font-weight:900;border-radius:16px;color:#fff;
    padding:13px 20px;font-size:16px;background:var(--green);box-shadow:0 5px 0 var(--green-deep);}
  .big-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--green-deep);}
  .big-btn.gray{background:#fff;color:var(--ink);box-shadow:0 5px 0 rgba(55,66,74,.15);}
  .big-btn.gray:active{box-shadow:0 1px 0 rgba(55,66,74,.15);}
  .big-btn.red{background:var(--red);box-shadow:0 5px 0 var(--red-deep);}
  .big-btn.red:active{box-shadow:0 1px 0 var(--red-deep);}

  /* ---- まちがい直しコース ---- */
  .miss-list{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px;}
  .miss-chip{background:#FDECE9;color:var(--red-deep);border-radius:10px;padding:5px 9px;font-size:13px;
    font-family:"M PLUS Rounded 1c";font-weight:900;}
  .miss-chip.shaky{background:#FDF0CF;color:#6a5000;}
  .miss-lead{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;}

  /* ---- 学習記録 ---- */
  .panel{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:18px 16px;margin-bottom:14px;}
  .panel h3{margin:0 0 10px;font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px;}
  .panel h3 .bar2{width:6px;height:18px;border-radius:3px;background:var(--teal2);}
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  @media(max-width:480px){.stat-row{grid-template-columns:1fr 1fr;}}
  .stat{background:#F7FAF9;border-radius:14px;padding:12px 8px;text-align:center;}
  .stat .v{font-family:"M PLUS Rounded 1c";font-weight:900;font-size:26px;color:var(--teal2);}
  .stat .k{font-size:11px;color:var(--ink-soft);font-weight:700;margin-top:2px;}
  table.rec{width:100%;border-collapse:collapse;font-size:13px;}
  table.rec th,table.rec td{padding:7px 6px;border-bottom:1px solid #EDF2EF;text-align:left;}
  table.rec th{font-size:11px;color:var(--ink-soft);font-weight:900;}
  table.rec td.n{font-family:"M PLUS Rounded 1c";font-weight:900;text-align:right;white-space:nowrap;}
  table.rec tr:last-child td{border-bottom:none;}
  .scorepill{display:inline-block;min-width:44px;text-align:center;border-radius:999px;padding:2px 8px;
    font-family:"M PLUS Rounded 1c";font-weight:900;color:#fff;font-size:12px;}
  .sp100{background:var(--red);} .sp80{background:var(--yellow);color:#6a5000;} .sp0{background:var(--ink-soft);}
  .miss-bars{display:flex;flex-direction:column;gap:8px;}
  .mb{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;}
  .mb .lab{flex:0 0 9.6em;}
  .mb .track{flex:1;height:14px;background:#F0F4F2;border-radius:999px;overflow:hidden;}
  .mb .fill{height:100%;border-radius:999px;}
  .mb .cnt{flex:0 0 3.6em;text-align:right;font-family:"M PLUS Rounded 1c";font-weight:900;}
  .spark{display:flex;align-items:flex-end;gap:3px;height:70px;padding-top:4px;}
  .spark .b{flex:1;min-width:5px;background:var(--teal2);border-radius:3px 3px 0 0;}
  .spark .b.s100{background:var(--red);} .spark .b.s80{background:var(--yellow);}
  .empty{color:var(--ink-soft);font-weight:700;font-size:13px;text-align:center;padding:14px 0;}
  .rowbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px;}
  .sbtn{border:none;border-radius:14px;padding:10px 16px;font-family:inherit;font-weight:900;font-size:13px;
    cursor:pointer;color:var(--ink);background:#fff;box-shadow:0 4px 0 rgba(55,66,74,.14);}
  .sbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(55,66,74,.14);}
  .sbtn.pur{background:var(--teal2);color:#fff;box-shadow:0 4px 0 var(--teal2-deep);}
  .sbtn.pur:active{box-shadow:0 1px 0 var(--teal2-deep);}
  .sbtn.danger{background:#FDECE9;color:var(--red);box-shadow:0 4px 0 #F3C4BC;}
  .sbtn.danger:active{box-shadow:0 1px 0 #F3C4BC;}
  .form-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;justify-content:center;}
  .fld{display:flex;flex-direction:column;gap:4px;}
  .fld label{font-size:11px;font-weight:900;color:var(--ink-soft);}
  .fld input{font-family:"M PLUS Rounded 1c";font-weight:900;font-size:18px;padding:8px 10px;width:74px;
    border:2px solid #E1E8E5;border-radius:12px;text-align:center;color:var(--ink);background:#fff;}
  .fld input.wide{width:150px;font-size:15px;text-align:left;font-family:"Zen Maru Gothic";}
  .fld input:focus{outline:none;border-color:var(--teal2);}
  .who-list{display:flex;flex-direction:column;gap:8px;}
  .who-item{display:flex;align-items:center;gap:10px;background:#F7FAF9;border-radius:14px;padding:10px 12px;}
  .who-item.on{background:#E6F2EE;box-shadow:0 0 0 2px var(--teal2) inset;}
  .who-item .nm{flex:1;font-weight:900;font-size:14px;}
  .who-item .sm2{font-size:11px;color:var(--ink-soft);font-weight:700;}
  .mini{border:none;background:#fff;border-radius:10px;padding:6px 10px;font-family:inherit;font-weight:900;
    font-size:12px;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 rgba(55,66,74,.12);}
  .mini:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(55,66,74,.12);}
  .mini.red{color:var(--red);}
  .notice{background:#FDF0CF;color:#6a5000;border-radius:12px;padding:9px 12px;font-size:12px;font-weight:700;margin-bottom:12px;}
  .detail{display:none;background:#F7FAF9;border-radius:12px;padding:10px 12px;margin-top:6px;font-size:12px;}
  .detail.show{display:block;}
  .detail div{padding:3px 0;font-family:"M PLUS Rounded 1c";font-weight:900;}
  .detail .ng{color:var(--red);}

  :focus-visible{outline:3px solid var(--blue);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="logo"><span class="pin">２乗</span><b>ｙ＝ａχ²</b></div>
    <div class="who">
      <button class="badge" id="whoBadge" title="学習者の切りかえ">学習者なし</button>
      <button class="icon-btn" id="soundBtn" title="おと">🔊</button>
    </div>
  </header>

  <!-- ===== メニュー ===== -->
  <section class="screen active" id="mainScreen">
    <div class="title-card">
      <h1>関数 <i>y</i>＝<i>a</i><i>χ</i><sup>2</sup> の基本</h1>
      <div class="sub">２乗に比例する関数の 式と値を あつかう</div>
      <div class="prompt">つぎのなかから、勉強することを えらびましょう。</div>
    </div>
    <div class="menu-head"><h2>メニュー</h2><p>番号キーでも えらべます</p></div>
    <div class="mlist" id="mainList"></div>
    <div class="foot"><a href="2kanmenu.html">← ２次関数のメニューへもどる</a></div>
    <div class="credit">
 岐阜女子大学（安藤忠展） Ver.5.02 ／ Web版
    </div>
  </section>

  <!-- ===== 学習記録 ===== -->
  <section class="screen" id="dataScreen">

<script>
/* =========================================================
   関数 y＝aχ² の基本 — Web版
   原作: N88-BASIC "2KAN1"
        岐阜県中学校数学教育研究会・小学校算数教育研究会（安藤忠展）
   ========================================================= */
const $=id=>document.getElementById(id);
const screens={main:$("mainScreen"),data:$("dataScreen"),play:$("playScreen"),result:$("resultScreen")};
function show(n){for(const k in screens)screens[k].classList.toggle("active",k===n);window.scrollTo({top:0,behavior:"smooth"});}
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const sg=()=>rnd(0,1)?1:-1;
const PRMSU=5, MISSN=3;

/* 原作のＫＲ情報メッセージ（0=正解, 1〜=まちがいの種類） */
const MISSMSG=["間違っていますよ！","もう一度 考えよう！","符号が違います！","絶対値が違います！","１が余分です！","ｘがありません！","２乗をわすれています！"];
const MISSMN =["正解","間違い","符号が違う","絶対値が違う","１が余分","ｘがない","２乗をわすれ"];

function signed(n){ return n<0?'－'+Math.abs(n):String(n); }
function coefHTML(a){ const s=a<0?'－':''; const c=Math.abs(a)===1?'':Math.abs(a); return s+c; }
function eqHTML(a){ return '<i>y</i>＝'+coefHTML(a)+'<i>χ</i><sup>2</sup>'; }
function eqText(a){ return 'y='+(a<0?'-':'')+(Math.abs(a)===1?'':Math.abs(a))+'x^2'; }
function qText(it){
  if(it.kind===0) return eqText(it.a)+' で x='+it.x+' のときの y';
  return eqText(it.a)+' の比例定数';
}
function answerText(it){ return String(it.answer); }

/* 原作 *D.SET.1 ： a=±1〜9、x=±1〜9、|y|≦150 */
function makeYFromX(){
  while(true){
    const a=rnd(1,9)*sg(), x=rnd(1,9)*sg(), y=a*x*x;
    if(Math.abs(y)>150) continue;
    return {kind:0,a:a,x:x,answer:y};
  }
}
/* 原作 *D.SET.2 ： a=±1〜9 */
function makeA(){
  const a=rnd(1,9)*sg();
  return {kind:1,a:a,answer:a};
}

const MODES=[
  {t:'ｘからｙの値を求める問題', sm:'ｙ＝ａχ² に ｘの値を あてはめて ｙを求める', gen:makeYFromX,
   hint:'<b><i>y</i>＝<i>a</i><i>χ</i><sup>2</sup></b> の <i>χ</i> に 数を あてはめます。<br>先に <b><i>χ</i><sup>2</sup></b>（χ×χ）を 計算して、そのあとで <b><i>a</i></b> を かけましょう。<br><i>χ</i> が 負の数でも、2乗すると 正の数 になります。'},
  {t:'比例定数を求める問題', sm:'ｙ＝ａχ² の ａ を 読みとる', gen:makeA,
   hint:'<b><i>y</i>＝<i>a</i><i>χ</i><sup>2</sup></b> の <b><i>a</i></b> が 比例定数です。<br><i>χ</i><sup>2</sup> の前の数を そのまま 答えます。符号（＋・－）も わすれずに。<br><i>y</i>＝<i>χ</i><sup>2</sup> のときは <b>1</b>、<i>y</i>＝－<i>χ</i><sup>2</sup> のときは <b>－1</b> です。'},
  {t:'ランダムコース', rand:true, sm:'2つのパターンから ランダムに出題'},
  {t:'まちがい直し', review:true, sm:'まちがえた問題を あつめて 練習'},
  {t:'学習者反応データ処理システム', data:true, sm:'学習の記録を 見る'}
];
const CAT_REVIEW=3, CAT_DATA=4;

const KEY='2kan1.records.v1';
const Store=(function(){
  let mem=null, usable=false;
  try{ const k='__t'+Date.now(); localStorage.setItem(k,'1'); localStorage.removeItem(k); usable=true; }catch(e){ usable=false; }
  return { usable:usable,
    load:function(){ if(!usable) return mem||{people:[],cur:null,logs:[]};
      try{ const s=localStorage.getItem(KEY); return s?JSON.parse(s):{people:[],cur:null,logs:[]}; }
      catch(e){ return {people:[],cur:null,logs:[]}; } },
    save:function(d){ if(!usable){mem=d;return;} try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){ mem=d; } } };
})();
let DB=Store.load();
function dbSave(){ Store.save(DB); }
function curPerson(){ if(!DB.cur) return null; for(let i=0;i<DB.people.length;i++) if(DB.people[i].id===DB.cur) return DB.people[i]; return null; }
function personLabel(p){ if(!p) return '学習者なし'; const s=p.nen+'年'+p.kumi+'組'+p.ban+'番'; return p.name?s+' '+p.name:s; }
function updateWhoBadge(){ $('whoBadge').textContent=personLabel(curPerson()); }
function kindName(m){ return MODES[m].t; }
function kaisuu(m){ const p=curPerson(); if(!p) return 0; const k=kindName(m); let n=0; DB.logs.forEach(g=>{ if(g.pid===p.id&&g.kind===k) n++; }); return n; }
function saveLog(ten,sec,ritu,hyouka,sousuu){
  const p=curPerson(); if(!p) return;
  const items=S.list.map(it=>({q:qText(it), ans:answerText(it), user:(it.user||'—'), ok:it.correct, tries:it.tries, misses:it.misses||[], kind:it.kind}));
  DB.logs.push({pid:p.id,at:Date.now(),mode:S.mode,kind:kindName(S.mode),ten:ten,sec:sec,ritu:ritu,hyouka:hyouka,sousuu:sousuu,items:items});
  dbSave();
}

/* =========================================================
   まちがい直しコース用の 問題プール
   ========================================================= */
function missPool(){
  const p=curPerson();
  const out={miss:[],shaky:[]};
  if(!p) return out;
  const st={};
  DB.logs.forEach(function(g){
    if(g.pid!==p.id) return;
    g.items.forEach(function(it){
      const state = !it.ok ? 2 : (it.tries>1 ? 1 : 0);
      st[it.q]={ raw:it, state:state, at:g.at, kind:g.kind };
    });
  });
  Object.keys(st).forEach(function(k){
    const v=st[k];
    if(v.state===2) out.miss.push(v);
    else if(v.state===1) out.shaky.push(v);
  });
  const newFirst=function(a,b){ return b.at-a.at; };
  out.miss.sort(newFirst); out.shaky.sort(newFirst);
  return out;
}
function shuffled(a){ const r=a.slice();
  for(let i=r.length-1;i>0;i--){ const j=rnd(0,i); const t=r[i]; r[i]=r[j]; r[j]=t; }
  return r; }
function missCount(){ const m=missPool(); return m.miss.length+m.shaky.length; }

function parseQItem(it){
  const q = it.q;
  if(q.includes('のときの y')){
    const m = /y=([+-]?\d*)x\^2 で x=([+-]?\d+)/.exec(q);
    if(m){
      const a = m[1]==='-' ? -1 : (m[1]===''? 1 : parseInt(m[1],10));
      const x = parseInt(m[2],10);
      return {kind:0, a:a, x:x, answer:a*x*x, mode:0};
    }
  } else {
    const m = /y=([+-]?\d*)x\^2 の比例定数/.exec(q);
    if(m){
      const a = m[1]==='-' ? -1 : (m[1]===''? 1 : parseInt(m[1],10));
      return {kind:1, a:a, answer:a, mode:1};
    }
  }
  return MODES[rnd(0,1)].gen();
}

function startReview(){
  const pool=missPool(), seen={}, list=[];
  let nMiss=0, nShaky=0;
  shuffled(pool.miss).forEach(function(x){
    if(list.length>=PRMSU||seen[x.raw.q]) return;
    seen[x.raw.q]=1; nMiss++;
    const p=parseQItem(x.raw);
    p.input=''; p.tries=0; p.correct=false; p.user=''; p.misses=[]; p.src="miss";
    list.push(p);
  });
  shuffled(pool.shaky).forEach(function(x){
    if(list.length>=PRMSU||seen[x.raw.q]) return;
    seen[x.raw.q]=1; nShaky++;
    const p=parseQItem(x.raw);
    p.input=''; p.tries=0; p.correct=false; p.user=''; p.misses=[]; p.src="shaky";
    list.push(p);
  });
  let guard=0;
  while(list.length<PRMSU&&guard<300){
    guard++;
    const mm=rnd(0,1);
    const p=MODES[mm].gen();
    const qKey = qText(p);
    if(seen[qKey]) continue;
    seen[qKey]=1;
    p.mode=mm; p.input=''; p.tries=0; p.correct=false; p.user=''; p.misses=[]; p.src="new";
    list.push(p);
  }
  const chip = (nMiss+nShaky)===0 ? 'まちがい直し（ランダム）' : 'まちがい直し';
  beginRound(CAT_REVIEW, list, chip);
}

let soundOn=true, actx=null;
function beep(type){ if(!soundOn) return;
  try{ actx=actx||new(window.AudioContext||window.webkitAudioContext)();
    const now=actx.currentTime;
    const pl=(f,s,d,v)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;
      o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(0,now+s);g.gain.linearRampToValueAtTime(v||.16,now+s+.02);
      g.gain.exponentialRampToValueAtTime(.0001,now+s+d);o.start(now+s);o.stop(now+s+d+.02);};
    if(type==='correct'){pl(660,0,.14);pl(880,.12,.2);} else if(type==='wrong'){pl(200,0,.18,.2);} else if(type==='tap'){pl(520,0,.05,.08);} else if(type==='fanfare'){pl(523,0,.13);pl(659,.13,.13);pl(784,.26,.13);pl(1046,.39,.3);}
  }catch(e){}
}

function chooseMain(i){
  const m=MODES[i]; if(!m) return;
  beep('tap');
  if(m.data) openData();
  else if(m.review) startReview();
  else startRound(i);
}

function buildMain(){
  const l=$('mainList'); l.innerHTML='';
  const nMiss=missCount();
  MODES.forEach((m,i)=>{
    const b=document.createElement('button');
    b.className='mcard'+(m.rand?' rand':'')+(m.review?' miss':'')+(m.data?' blue':'');
    let sm=m.sm;
    if(m.review){
      sm = nMiss ? 'まちがえた問題を あつめて 5問（たりないぶんは ランダム）'
                 : 'いまは 記録がないので ランダムに5問';
    }
    const key = i===4 ? '0' : String(i+1);
    b.innerHTML='<span class="n">'+key+'</span><span class="lbl">'+m.t+'<span class="sm">'+sm+'</span></span>';
    b.addEventListener('click',function(){ chooseMain(i); });
    l.appendChild(b);
  });
}

let S={mode:0,list:[],cur:0,locked:false,t0:0,typeCount:[0,0,0,0,0,0,0]};
let timerId=null;

function beginRound(mode, list, chip){
  S={mode:mode,list:list,cur:0,locked:false,t0:Date.now(),typeCount:[0,0,0,0,0,0,0]};
  $('modeChip').textContent=chip;
  buildDots(); show('play'); startTimer(); render();
}

function uniqueKey(p){ return [p.kind,p.a,p.x].join(','); }
function startRound(mode){
  const seen={}, list=[];
  for(let i=0;i<PRMSU;i++){
    let p, mm, key, guard=0;
    do{
      mm = MODES[mode].rand ? rnd(0,1) : mode;
      p = MODES[mm].gen();
      key = uniqueKey(p);
    }while(seen[key] && ++guard<200);
    seen[key]=1;
    p.mode=mm; p.input=''; p.tries=0; p.correct=false; p.user=''; p.misses=[];
    list.push(p);
  }
  beginRound(mode, list, kindName(mode));
}
function buildDots(){ const d=$('dots'); d.innerHTML=''; for(let i=0;i<PRMSU;i++){ const s=document.createElement('span'); s.className='dot'; d.appendChild(s);} }
function updateDots(){ const ch=$('dots').children; for(let i=0;i<ch.length;i++){ const el=ch[i],it=S.list[i]; el.className='dot'; if(i<S.cur){ el.classList.add(it.correct?'ok':'ng'); el.textContent=it.correct?'○':'✕'; } else if(i===S.cur){ el.classList.add('now'); el.textContent=''; } else el.textContent=''; } }

function render(){
  const it=S.list[S.cur], m=MODES[it.mode];
  S.locked=false; it.input='';
  $('msg').textContent=''; $('msg').className='msg';
  $('reveal').classList.remove('show'); $('reveal').innerHTML='';
  $('stamp').innerHTML=''; $('hintBox').classList.remove('show');
  $('hintBox').innerHTML=m.hint;
  $('note').textContent='正しい答えを いれましょう。';
  $('qline').innerHTML='<div class="formula-card">'+eqHTML(it.a)+'</div>';
  if(it.kind===0){
    $('qsub').innerHTML='<i>χ</i>＝<b>'+signed(it.x)+'</b> のとき';
    $('alabel').innerHTML='<i>y</i>＝';
  }else{
    $('qsub').innerHTML='この式の <b>比例定数</b> は？';
    $('alabel').textContent='比例定数＝';
  }
  $('enterBtn').textContent='こたえあわせ';
  updateDots(); updateInputView();
}
function inputHTML(s){ return s.replace(/-/g,'－').replace(/\+/g,'＋'); }
function updateInputView(){
  const it=S.list[S.cur];
  $('ans').innerHTML = it.input ? inputHTML(it.input) : '';
  $('ans').classList.toggle('blink', it.input==='' && !S.locked);
}
function press(k){
  if(S.locked) return;
  const it=S.list[S.cur];
  if(k==='del'){ if(!it.input) { beep('wrong'); return; } it.input=it.input.slice(0,-1); beep('tap'); updateInputView(); return; }
  if(k==='+'||k==='-'){
    if(it.input===''||it.input==='+'||it.input==='-') it.input=k;
    else { beep('wrong'); return; }
    beep('tap'); updateInputView(); return;
  }
  const digits=it.input.replace(/[^0-9]/g,'');
  if(digits.length>=4){ beep('wrong'); return; }
  it.input+=k; beep('tap'); updateInputView();
}
document.querySelectorAll('#keypad .key').forEach(function(b){ b.addEventListener('click',function(){ press(b.dataset.k); }); });
$('enterBtn').addEventListener('click',submit);
$('hintBtn').addEventListener('click',function(){ beep('tap'); $('hintBox').classList.toggle('show'); });
document.addEventListener('keydown',function(e){
  if(screens.play.classList.contains('active')){
    if(e.key==='Enter'){ submit(); e.preventDefault(); return; }
    if(e.key==='Backspace'){ press('del'); e.preventDefault(); return; }
    if(e.key>='0'&&e.key<='9'){ press(e.key); return; }
    if(e.key==='-'){ press('-'); return; }
    if(e.key==='+'){ press('+'); return; }
    return;
  }
  if(screens.main.classList.contains('active')&&e.key>='0'&&e.key<='9'){
    chooseMain(e.key==='0' ? CAT_DATA : parseInt(e.key,10)-1);
  }
});

/* 原作 *MISS.TYPE を踏襲した まちがいの分類 */
function classify(it){
  const v=parseInt(it.input,10);
  if(isNaN(v)) return {ok:false, miss:1};
  const c=it.answer;
  if(v===c) return {ok:true, miss:0};
  if(Math.abs(v)===Math.abs(c)) return {ok:false, miss:2};              /* 符号が違う */
  if(it.kind===0 && v===it.a*it.x) return {ok:false, miss:6};           /* ２乗をわすれている */
  if(Math.sign(v)===Math.sign(c)) return {ok:false, miss:3};            /* 絶対値が違う */
  return {ok:false, miss:1};
}
function revealHTML(it){
  let h='答えは <b>'+signed(it.answer)+'</b>';
  if(it.kind===0){
    h+='<div class="step">'+eqHTML(it.a)+' に <i>χ</i>＝'+signed(it.x)+' を あてはめて<br>'
      +'<i>y</i>＝'+coefHTML(it.a)+'×('+signed(it.x)+')<sup>2</sup>＝'+coefHTML(it.a)+'×'+(it.x*it.x)+'＝<b>'+signed(it.answer)+'</b></div>';
  }else{
    h+='<div class="step">'+eqHTML(it.a)+' の <i>χ</i><sup>2</sup> の前の数だから 比例定数は <b>'+signed(it.answer)+'</b></div>';
  }
  return h;
}
function submit(){
  if(S.locked) return;
  const it=S.list[S.cur];
  if(it.input===''||it.input==='+'||it.input==='-'){ beep('wrong'); $('msg').textContent='答えを いれましょう。'; $('msg').className='msg bad'; return; }
  it.tries++;
  const r=classify(it);
  S.typeCount[r.miss]++;
  it.user=inputHTML(it.input);
  if(r.ok){
    S.locked=true; it.correct=true;
    stamp('maru'); beep('correct');
    $('msg').textContent='正解！'; $('msg').className='msg good';
    setTimeout(next,1100);
  } else {
    stamp('batsu'); beep('wrong');
    it.misses.push(r.miss);
    $('msg').textContent=(it.tries>=MISSN?MISSMSG[0]:MISSMSG[1])+' '+(MISSMSG[r.miss]||''); $('msg').className='msg bad';
    if(it.tries>=MISSN){
      S.locked=true; it.correct=false;
      $('reveal').innerHTML=revealHTML(it);
      $('reveal').classList.add('show');
      setTimeout(next,3000);
    } else {
      it.input=''; updateInputView();
      setTimeout(function(){ $('stamp').innerHTML=''; },900);
    }
  }
}
function next(){ S.cur++; if(S.cur>=PRMSU) finish(); else render(); }
function stamp(t){ const el=$('stamp'); if(t==='maru'){ el.className='stamp maru'; el.innerHTML='<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="#EA5040" stroke-width="9"/><circle cx="50" cy="50" r="27" fill="none" stroke="#EA5040" stroke-width="7"/></svg>'; } else { el.className='stamp batsu'; el.innerHTML='<svg viewBox="0 0 100 100"><line x1="22" y1="22" x2="78" y2="78" stroke="#EA5040" stroke-width="11" stroke-linecap="round"/><line x1="78" y1="22" x2="22" y2="78" stroke="#EA5040" stroke-width="11" stroke-linecap="round"/></svg>'; } }
function startTimer(){ clearInterval(timerId); timerId=setInterval(function(){ $('timerText').textContent=fmtTime(Math.floor((Date.now()-S.t0)/1000)); },500); }
function fmtTime(s){ const m=Math.floor(s/60); return m===0?s+'びょう':m+'ふん'+(s%60)+'びょう'; }

/* 原作 *KAISEKI の総合評価 */
function hyoukaOf(ritu,ten){
  let h=1;
  if(ritu>=30 && ten>=60) h=2;
  if(ritu>=50 && ten>=80) h=3;
  if(ritu>=70 && ten===100) h=4;
  if(ritu===100 && ten===100) h=5;
  return h;
}
function finish(){
  clearInterval(timerId);
  let ok=0; for(let i=0;i<S.list.length;i++) if(S.list[i].correct) ok++;
  const ten=Math.floor(ok/PRMSU*100), sec=Math.floor((Date.now()-S.t0)/1000);
  let sousuu=0; S.typeCount.forEach(n=>sousuu+=n);
  const ritu=sousuu?Math.floor(100*S.typeCount[0]/sousuu):0;
  const hy=hyoukaOf(ritu,ten);
  saveLog(ten,sec,ritu,hy,sousuu);
  buildMain();
  const nm=missCount();
  $("missAgainBtn").style.display = (nm>0&&curPerson()) ? "" : "none";
  $('scoreNum').textContent=ten;
  const w=$('hanamaruWrap'), m=$('resultMsg');
  if(ten===100){ m.textContent='よくできました！'; m.style.color='var(--red)'; w.innerHTML=hanamaru(); beep('fanfare'); }
  else if(ten>=80){ m.textContent='あともうすこし！'; m.style.color='var(--yellow-deep)'; w.innerHTML=star(); beep('correct'); }
  else { m.textContent='もっとがんばろう！'; m.style.color='var(--green)'; w.innerHTML=face(); }
  const p0=curPerson();
  $('resultTime').textContent='じかん： '+fmtTime(sec)+(p0?(' ／ この種類は '+kaisuu(S.mode)+'回目'):'');
  $('hyoukaBox').innerHTML='総合評価 <span class="st">【'+hy+'】</span> 正答率 '+ritu+'％（総解答数 '+sousuu+'回）';
  const rv=$('review'); rv.innerHTML='';
  S.list.forEach(function(it){
    const row=document.createElement('div'); row.className='review-row';
    const q = (it.kind===0) ? (eqHTML(it.a)+' <i>χ</i>＝'+signed(it.x)) : (eqHTML(it.a)+' 比例定数');
    row.innerHTML='<span class="rmark '+(it.correct?'ok':'ng')+'">'+(it.correct?'○':'✕')+'</span>'
      +'<span class="rq">'+q+'</span>'
      +'<span>'+(it.correct?'<span class="rc">'+(it.user||'—')+'</span>'
        :'<span class="ra wrong">'+(it.user||'—')+'</span><span class="rc">正解 '+signed(it.answer)+'</span>')+'</span>';
    rv.appendChild(row);
  });
  const kb=$('kaisekiBars'); kb.innerHTML='';
  const order=[0,2,3,6,1], colors=['var(--green)','var(--teal2)','var(--blue)','var(--yellow-deep)','#B9C3C0'];
  order.forEach(function(idx,i){
    const n=S.typeCount[idx], pc=sousuu?Math.round(n/sousuu*100):0;
    const d=document.createElement('div'); d.className='mb';
    d.innerHTML='<span class="lab">'+MISSMN[idx]+'</span><span class="track"><span class="fill" style="width:'+pc+'%;background:'+colors[i]+'"></span></span><span class="cnt">'+n+'回</span>';
    kb.appendChild(d);
  });
  show('result');
}
function hanamaru(){let p=''; for(let i=0;i<8;i++){const a=i/8*Math.PI*2; p+='<circle cx="'+(60+30*Math.cos(a)).toFixed(1)+'" cy="'+(60+30*Math.sin(a)).toFixed(1)+'" r="17" fill="#F6B93B"/>'; } return '<svg width="115" height="115" viewBox="0 0 120 120">'+p+'<circle cx="60" cy="60" r="30" fill="#FDE9BE"/><circle cx="60" cy="60" r="24" fill="none" stroke="#EA5040" stroke-width="6"/><circle cx="60" cy="60" r="15" fill="none" stroke="#EA5040" stroke-width="5"/></svg>'; }
function star(){let pts=''; for(let i=0;i<10;i++){const r=i%2===0?42:18,a=(-90+i*36)*Math.PI/180; pts+=(60+r*Math.cos(a)).toFixed(1)+','+(60+r*Math.sin(a)).toFixed(1)+' '; } return '<svg width="115" height="115" viewBox="0 0 120 120"><polygon points="'+pts+'" fill="#F6B93B" stroke="#D89A2C" stroke-width="4" stroke-linejoin="round"/></svg>'; }
function face(){ return '<svg width="115" height="115" viewBox="0 0 120 120"><circle cx="60" cy="60" r="42" fill="#EAF6F0" stroke="#34B37A" stroke-width="5"/><circle cx="46" cy="52" r="5" fill="#34B37A"/><circle cx="74" cy="52" r="5" fill="#34B37A"/><path d="M42 74 Q60 90 78 74" fill="none" stroke="#34B37A" stroke-width="5" stroke-linecap="round"/></svg>'; }

function openData(){ renderData(); show('data'); }
function renderData(){
  $('storeNotice').innerHTML=Store.usable?'' : '<div class="notice">※ このかんきょうでは 記録を ブラウザに 保存できません。いまの記録は 画面を とじると 消えます。のこしたいときは「CSVで書き出す」を つかってください。</div>';
  renderWhoList();
  const p=curPerson();
  const logs=DB.logs.filter(g=>p&&g.pid===p.id);
  $('stCount').textContent=logs.length;
  if(logs.length){ let sum=0,best=0; logs.forEach(g=>{ sum+=g.ten; if(g.ten>best) best=g.ten; }); $('stAvg').textContent=Math.round(sum/logs.length); $('stBest').textContent=best; }
  else { $('stAvg').textContent='—'; $('stBest').textContent='—'; }
  const sp=$('spark'); sp.innerHTML='';
  if(!logs.length) sp.innerHTML='<div class="empty" style="width:100%">まだ 記録が ありません</div>';
  else logs.slice(-24).forEach(function(g){ const b=document.createElement('div'); b.className='b'+(g.ten===100?' s100':(g.ten>=80?' s80':'')); b.style.height=Math.max(6,g.ten*0.6)+'px'; b.title=fmtDate(g.at)+' '+g.kind+' '+g.ten+'点'; sp.appendChild(b); });

  renderMissCourse();

  const mc=[0,0,0,0,0,0,0];
  let miss=0;
  logs.forEach(g=>g.items.forEach(it=>(it.misses||[]).forEach(m=>{ if(m>=0&&m<=6){ mc[m]++; miss++; } })));
  const order=[2,3,6,1], labels=['符号が違う','絶対値が違う','２乗をわすれている','そのほか'], colors=['var(--teal2)','var(--blue)','var(--yellow-deep)','#B9C3C0'];
  const mb=$('missBars'); mb.innerHTML='';
  if(!miss) mb.innerHTML='<div class="empty">まちがいの 記録が ありません</div>';
  else order.forEach(function(idx,i){ const n=mc[idx], pc=miss?Math.round(n/miss*100):0; const d=document.createElement('div'); d.className='mb'; d.innerHTML='<span class="lab">'+labels[i]+'</span><span class="track"><span class="fill" style="width:'+pc+'%;background:'+colors[i]+'"></span></span><span class="cnt">'+n+'回</span>'; mb.appendChild(d); });
  const bk={}; logs.forEach(function(g){ if(!bk[g.kind]) bk[g.kind]={n:0,sum:0,best:0}; bk[g.kind].n++; bk[g.kind].sum+=g.ten; if(g.ten>bk[g.kind].best) bk[g.kind].best=g.ten; });
  const keys=Object.keys(bk), byk=$('byKind');
  if(!keys.length) byk.innerHTML='<div class="empty">まだ 記録が ありません</div>';
  else { let h='<table class="rec"><tr><th>種類</th><th style="text-align:right">回数</th><th style="text-align:right">平均</th><th style="text-align:right">最高</th></tr>'; keys.forEach(function(k){ const v=bk[k]; h+='<tr><td>'+k+'</td><td class="n">'+v.n+'</td><td class="n">'+Math.round(v.sum/v.n)+'</td><td class="n">'+v.best+'</td></tr>'; }); byk.innerHTML=h+'</table>'; }
  const hs=$('history');
  if(!logs.length) hs.innerHTML='<div class="empty">まだ 記録が ありません</div>';
  else { let h='<table class="rec"><tr><th>日時</th><th>種類</th><th style="text-align:right">点数</th><th style="text-align:right">評価</th><th style="text-align:right">時間</th></tr>'; logs.slice().reverse().slice(0,30).forEach(function(g,i){ const cls=g.ten===100?'sp100':(g.ten>=80?'sp80':'sp0'); h+='<tr class="hrow" data-i="'+i+'" style="cursor:pointer"><td>'+fmtDate(g.at)+'</td><td>'+g.kind+'</td><td class="n"><span class="scorepill '+cls+'">'+g.ten+'点</span></td><td class="n">'+(g.hyouka?'【'+g.hyouka+'】':'—')+'</td><td class="n">'+fmtTime(g.sec)+'</td></tr><tr><td colspan="5" style="padding:0"><div class="detail" id="dt'+i+'">'+detailHTML(g)+'</div></td></tr>'; }); hs.innerHTML=h+'</table>'; hs.querySelectorAll('.hrow').forEach(function(tr){ tr.addEventListener('click',function(){ $('dt'+tr.dataset.i).classList.toggle('show'); }); }); }
}

function renderMissCourse(){
  const p=curPerson(), pool=missPool();
  const n=pool.miss.length, s=pool.shaky.length, fixed=n+s;
  const lead=$("missLead"), box=$("missList");
  if(!p){
    lead.textContent="学習者を えらぶと、その人が まちがえた問題を あつめて 出題します。（いまは ランダム5問になります）";
  } else if(fixed===0){
    lead.textContent="いま 直す問題は ありません。始めると ランダムに5問 出題します。";
  } else {
    lead.textContent="直したい問題を あつめて 5問 出題します。"
      +(fixed<PRMSU?"（たりないぶんは ランダムに出題します）":"");
  }
  box.innerHTML="";
  pool.miss.slice(0,12).concat(pool.shaky.slice(0,12-Math.min(12,pool.miss.length))).forEach(function(x){
    const d=document.createElement("span");
    d.className="miss-chip"+(x.state===1?" shaky":"");
    d.innerHTML=x.raw.q.replace(/x/g,'<i>χ</i>');
    d.title=(x.state===2?"まちがえた問題":"2回以上かかった問題")+"（正解 "+signed(x.raw.ans)+"）";
    box.appendChild(d);
  });
  if(fixed>12) box.appendChild(Object.assign(document.createElement("span"),
    {className:"miss-chip shaky",textContent:"ほか"}));
  $("missStartBtn").textContent = fixed===0 ? "ランダムで 練習する" : "まちがい直しを 始める";
  buildMain();
}

function detailHTML(g){ let h=''; g.items.forEach(function(it){ h+='<div class="'+(it.ok?'':'ng')+'">'+(it.ok?'○':'✕')+' '+it.q+' → '+(it.user||'—')+(it.ok?'':' （正解＝'+it.ans+'）')+'</div>'; }); return h; }
function fmtDate(t){ const d=new Date(t); return (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+('0'+d.getMinutes()).slice(-2); }
function renderWhoList(){ const l=$('whoList'); l.innerHTML=''; if(!DB.people.length){ l.innerHTML='<div class="empty">学習者を 登録すると 記録が のこせます</div>'; return; } DB.people.forEach(function(p){ const d=document.createElement('div'); d.className='who-item'+(p.id===DB.cur?' on':''); const n=DB.logs.filter(g=>g.pid===p.id).length; d.innerHTML='<span class="nm">'+personLabel(p)+'<span class="sm2"> '+n+'回</span></span>'; const b1=document.createElement('button'); b1.className='mini'; b1.textContent=(p.id===DB.cur?'えらび中':'えらぶ'); b1.addEventListener('click',function(){ DB.cur=p.id; dbSave(); updateWhoBadge(); renderData(); }); const b2=document.createElement('button'); b2.className='mini red'; b2.textContent='けす'; b2.addEventListener('click',function(){ if(!confirm(personLabel(p)+' を 記録ごと 消しますか？')) return; DB.people=DB.people.filter(x=>x.id!==p.id); DB.logs=DB.logs.filter(g=>g.pid!==p.id); if(DB.cur===p.id) DB.cur=DB.people.length?DB.people[0].id:null; dbSave(); updateWhoBadge(); renderData(); }); d.appendChild(b1); d.appendChild(b2); l.appendChild(d); }); }
function pad2(s){ s=String(s).replace(/[^0-9]/g,''); return s.length?('0'+s).slice(-2):'00'; }
$('addWhoBtn').addEventListener('click',function(){ const nen=(String($('fNen').value).replace(/[^0-9]/g,'')||'3').slice(0,1); const kumi=pad2($('fKumi').value), ban=pad2($('fBan').value), name=$('fName').value.trim(); const id=nen+kumi+ban+'-'+Date.now().toString(36); DB.people.push({id:id,nen:nen,kumi:kumi,ban:ban,name:name}); DB.cur=id; dbSave(); $('fNen').value=''; $('fKumi').value=''; $('fBan').value=''; $('fName').value=''; updateWhoBadge(); renderData(); beep('tap'); });
$('csvBtn').addEventListener('click',function(){ const p=curPerson(); const logs=DB.logs.filter(g=>p&&g.pid===p.id); if(!p||!logs.length){ alert('書き出す記録が ありません。'); return; } const rows=[["学年","組","番号","名前","日時","種類","点数","評価","正答率","時間(秒)","問題","解答","正解","正誤","回数"]]; logs.forEach(function(g){ g.items.forEach(function(it){ rows.push([p.nen,p.kumi,p.ban,p.name,new Date(g.at).toLocaleString('ja-JP'),g.kind,g.ten,g.hyouka||'',g.ritu||'',g.sec,it.q,it.user,it.ans,it.ok?'○':'×',it.tries]); }); }); const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n'); const blob=new Blob([new Uint8Array([0xEF,0xBB,0xBF]),csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='関数y=ax2_基本_学習記録_'+p.nen+p.kumi+p.ban+'.csv'; document.body.appendChild(a); a.click(); document.body.removeChild(a); });
$('clearBtn').addEventListener('click',function(){ const p=curPerson(); if(!p){ alert('学習者が えらばれていません。'); return; } if(!confirm(personLabel(p)+' の 記録を すべて 消しますか？')) return; DB.logs=DB.logs.filter(g=>g.pid!==p.id); dbSave(); renderData(); });
$('dataBackBtn').addEventListener('click',function(){ beep('tap'); show('main'); });
$('whoBadge').addEventListener('click',function(){ beep('tap'); openData(); });
$('playBackBtn').addEventListener('click',function(){ clearInterval(timerId); show('main'); });
$('againBtn').addEventListener('click',function(){ beep('tap'); startRound(S.mode); });
$('missAgainBtn').addEventListener('click',function(){beep('tap');startReview();});
$('homeBtn').addEventListener('click',function(){ beep('tap'); show('main'); });
$('soundBtn').addEventListener('click',function(){ soundOn=!soundOn; $('soundBtn').textContent=soundOn?'🔊':'🔇'; });
document.addEventListener('pointerdown',function(){ if(!actx){ try{ actx=new(window.AudioContext||window.webkitAudioContext)(); }catch(e){} } },{once:true});

buildMain(); updateWhoBadge();
