<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正方形と直角二等辺三角形：三角形の残りの部分</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF8EF; --paper:#FFFDF9; --card:#FFFFFF; --line:#E9D9C4; --ink:#37424A;
    --teal:#19A199; --teal-deep:#0E6F6B; --accent:#F6B93B; --red:#EA5040; --soft:#F7EFE4;
    --shadow:0 10px 26px rgba(55,66,74,.10);
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#FFF7EC,#FFFDF8 28%,#FFF8EF);color:var(--ink);font-family:"Zen Maru Gothic",system-ui,sans-serif}
  .wrap{max-width:1200px;margin:0 auto;padding:14px}
  .app{background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
  .top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line)}
  .logo{display:flex;align-items:center;gap:10px}.pin{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:#fff;font-weight:900}.logo b{font-size:18px}
  .hero{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:16px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px}
  h1{margin:0 0 8px;font-size:clamp(24px,4vw,34px)}
  .sub{color:#6B7A84;line-height:1.7}
  .tag{display:inline-block;padding:7px 12px;border-radius:999px;background:#E8F7F4;color:var(--teal-deep);font-weight:900;font-size:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .fld{display:grid;gap:6px}.fld label{font-weight:700;font-size:14px;color:#586973}
  .fld input{width:100%;padding:10px 12px;border-radius:13px;border:2px solid #D8E6E0;font:800 18px/1.2 "M PLUS Rounded 1c",sans-serif;color:var(--ink)}
  .fld input:focus{outline:none;border-color:var(--teal)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .btn{border:none;background:#fff;border-radius:14px;padding:10px 14px;font-family:inherit;font-weight:900;cursor:pointer;box-shadow:0 3px 0 rgba(55,66,74,.10);color:var(--ink)}
  .btn.primary{background:var(--teal);color:#fff;box-shadow:0 3px 0 var(--teal-deep)}
  .btn.warn{background:var(--accent);color:#6A4A00;box-shadow:0 3px 0 #CF9D2E}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .stat{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
  .stat .k{font-size:12px;color:#6B7A84}.stat .v{font:900 28px/1 "M PLUS Rounded 1c",sans-serif;color:var(--teal)}
  .note{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:12px 14px;line-height:1.7;margin-top:14px}
  .mainview{display:grid;grid-template-columns:1fr;gap:16px}
  .svghold{background:linear-gradient(180deg,#FFF,#FFF8F1);border:1px solid var(--line);border-radius:20px;padding:10px}
  svg{width:100%;height:auto;display:block}
  .slider{margin-top:10px}.slider input{width:100%}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#586973;margin-top:8px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px}
  .small{font-size:13px;color:#6B7A84}
  .topright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .topright .btn{text-decoration:none;white-space:nowrap}
  .switches{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .sw{display:flex;align-items:center;gap:7px;background:var(--soft);border:1px solid var(--line);
    border-radius:14px;padding:9px 13px;font-weight:900;font-size:14px;cursor:pointer;user-select:none}
  .sw input{width:18px;height:18px;accent-color:var(--teal);cursor:pointer}
  .tblhold{overflow-x:auto;overflow-y:hidden;padding-bottom:4px}
  .hero>*{min-width:0}.mainview{min-width:0}.mainview>.panel{min-width:0}
  table.vt{border-collapse:collapse;font-family:"M PLUS Rounded 1c",sans-serif;margin-top:8px}
  table.vt th,table.vt td{border:1px solid #E9D9C4;padding:8px 10px;text-align:center;font-size:16px;font-weight:800;white-space:nowrap}
  table.vt th{position:sticky;left:0;background:#F7EFE4;font-size:13px;color:#586973;z-index:1}
  table.vt td.now{background:#FFF3E2;color:var(--red)}
  @media (max-width:920px){.hero{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="app">
    <div class="top">
      <div class="logo"><span class="pin">△</span><b>速さの問題</b></div>
      <div class="topright"><span class="tag">正方形と直角二等辺三角形</span>
        <a class="btn" href="zukeikansuu.html">← メニューにもどる</a></div>
    </div>

    <div class="hero">
      <div class="panel">
        <h1>三角形の残りの部分</h1>
        <div class="sub">正方形の上を直角二等辺三角形が右へ移動するとき、<b>三角形のうち正方形の外に残る部分の面積</b>がどう変わるかを調べましょう。グラフと表は、必要になったら表示できます。</div>
        <div class="grid2">
          <div class="fld"><label>正方形の1辺 AB＝BC（3〜10）</label><input id="hen" type="number" min="3" max="10" step="1" value="6"></div>
          <div class="fld"><label>三角形の直角をはさむ辺 EF＝FG（2〜10）</label><input id="leg" type="number" min="2" max="10" step="1" value="6"></div>
          <div class="fld"><label>移動の速さ（1〜5）</label><input id="hayasa" type="number" min="1" max="5" step="1" value="1"></div>
        </div>
        <div class="switches">
          <label class="sw"><input type="checkbox" id="swGraph">グラフを表示</label>
          <label class="sw"><input type="checkbox" id="swTable">表を表示</label>
        </div>
        <div class="toolbar">
          <button class="btn primary" id="applyBtn">図を更新</button>
          <button class="btn primary" id="playBtn">再生</button>
          <button class="btn" id="pauseBtn">一時停止</button>
          <button class="btn warn" id="resetBtn">最初にもどす</button>
        </div>
        <div class="stats">
          <div class="stat"><div class="k">時刻 x（秒）</div><div class="v" id="tNow">0</div></div>
          <div class="stat"><div class="k">残りの面積 y（cm²）</div><div class="v" id="aNow">0</div></div>
          <div class="stat"><div class="k">三角形全体の面積</div><div class="v" id="aFull">0</div></div>
        </div>
        <div class="slider">
          <input id="timeSlider" type="range" min="0" max="12" value="0" step="0.01">
          <div class="small">時間の範囲：0 〜 <span id="tEndTxt">12</span> 秒</div>
        </div>
        <div class="note" id="noteBox"></div>
      </div>

      <div class="mainview">
        <div class="panel svghold">
          <svg id="geoSvg" viewBox="0 0 760 360" aria-label="図形の表示"></svg>
          <div class="legend">
            <span><span class="dot" style="background:#2E86DE"></span>正方形 ABCD</span>
            <span><span class="dot" style="background:#F6B93B"></span>移動する直角二等辺三角形 EFG</span>
            <span><span class="dot" style="background:#EA5040"></span>正方形の外に残る部分</span>
          </div>
        </div>
        <div class="panel svghold" id="graphPanel" style="display:none">
          <svg id="graphSvg" viewBox="0 0 760 300" aria-label="面積グラフ"></svg>
          <div class="small">「再生」やスライダーで点を動かすと、通った跡が線になってグラフがあらわれます。<button class="btn" id="clearTrailBtn" style="margin-left:8px;padding:6px 12px;font-size:13px">跡を消す</button></div>
        </div>
        <div class="panel" id="tablePanel" style="display:none">
          <div class="tag">表</div>
          <div class="tblhold"><table class="vt" id="valTable"></table></div>
          <div class="small">上が x（秒）、下が y（cm²）です。点がとおったところから数が出ます。</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const S={cfg:{tate:6,yoko:6,tei:6,takasa:6,hayasa:1},t:0,playing:false,last:0,showGraph:false,showTable:false,trail:[]};
/* 正方形は AB＝BC、三角形は EF＝FG（直角二等辺）に そろえる */
function makeCfg(hen,leg,hayasa){ return {tate:hen,yoko:hen,tei:leg,takasa:leg,hayasa:hayasa}; }

function clamp(v,min,max){ return Math.min(max,Math.max(min,v)); }
function num(id,min,max){ const v=parseFloat($(id).value||0); return clamp(isFinite(v)?v:min,min,max); }
function fmt(v){ return (Math.round(v*100)/100).toString(); }
function triArea(cfg){ return cfg.tei*cfg.takasa/2; }
/* 点F が 点B に かさなる ところまで（F の x座標 ＝ 0）*/
function tEnd(cfg){ return cfg.tei / cfg.hayasa; }

function triAt(cfg,t){
  const dx=cfg.hayasa*t;
  return [
    {x:-cfg.tei+dx, y:cfg.takasa},
    {x:-cfg.tei+dx, y:0},
    {x:0+dx, y:0}
  ];
}
function polyArea(poly){
  if(poly.length<3) return 0;
  let s=0;
  for(let i=0;i<poly.length;i++){
    const a=poly[i], b=poly[(i+1)%poly.length];
    s += a.x*b.y - b.x*a.y;
  }
  return Math.abs(s)/2;
}
function intersect(a,b,edge,val){
  const dx=b.x-a.x, dy=b.y-a.y;
  if(edge==='left' || edge==='right'){
    if(dx===0) return {x:val,y:a.y};
    const t=(val-a.x)/dx; return {x:val, y:a.y+t*dy};
  }
  if(dy===0) return {x:a.x,y:val};
  const t=(val-a.y)/dy; return {x:a.x+t*dx, y:val};
}
function clipHalf(poly,edge,val){
  const inside=p=> edge==='left'?p.x>=val-1e-9 : edge==='right'?p.x<=val+1e-9 : edge==='bottom'?p.y>=val-1e-9 : p.y<=val+1e-9;
  const out=[];
  for(let i=0;i<poly.length;i++){
    const a=poly[i], b=poly[(i+1)%poly.length];
    const ia=inside(a), ib=inside(b);
    if(ia && ib){ out.push(b); }
    else if(ia && !ib){ out.push(intersect(a,b,edge,val)); }
    else if(!ia && ib){ out.push(intersect(a,b,edge,val)); out.push(b); }
  }
  return out;
}
function overlapPoly(cfg,t){
  let poly=triAt(cfg,t);
  poly=clipHalf(poly,'left',0);
  poly=clipHalf(poly,'right',cfg.yoko);
  poly=clipHalf(poly,'bottom',0);
  poly=clipHalf(poly,'top',cfg.tate);
  return poly;
}
function remainArea(cfg,t){
  const total=triArea(cfg);
  const ov=polyArea(overlapPoly(cfg,t));
  return Math.max(0,total-ov);
}

function worldBounds(cfg){
  return {xmin:-cfg.tei-1, xmax:Math.max(cfg.yoko,cfg.tei)+1, ymin:-0.5, ymax:Math.max(cfg.tate,cfg.takasa)+1};
}
function mapXY(x,y,b,w,h,p=24){
  /* たて・よこ 同じ 倍率（正方形が 正方形に 見えるように） */
  const bw=b.xmax-b.xmin, bh=b.ymax-b.ymin;
  const s=Math.min((w-2*p)/bw,(h-2*p)/bh);
  const ox=p+((w-2*p)-s*bw)/2, oy=h-p-((h-2*p)-s*bh)/2;
  return {x:ox+(x-b.xmin)*s, y:oy-(y-b.ymin)*s};
}
function pointsStr(poly,b,w,h){ return poly.map(p=>{const q=mapXY(p.x,p.y,b,w,h); return q.x.toFixed(1)+','+q.y.toFixed(1);}).join(' '); }

function drawGeometry(){
  const cfg=S.cfg, t=S.t;
  const svg=$('geoSvg'), w=760, h=360, b=worldBounds(cfg);
  const rect=[{x:0,y:cfg.tate},{x:0,y:0},{x:cfg.yoko,y:0},{x:cfg.yoko,y:cfg.tate}];
  const tri=triAt(cfg,t), ov=overlapPoly(cfg,t);
  const pA=mapXY(0,cfg.tate,b,w,h), pB=mapXY(0,0,b,w,h), pC=mapXY(cfg.yoko,0,b,w,h), pD=mapXY(cfg.yoko,cfg.tate,b,w,h);
  const label=(txt,p,dx,dy)=>'<text x="'+(p.x+dx)+'" y="'+(p.y+dy)+'" font-size="18" font-weight="900" fill="#37424A">'+txt+'</text>';
  const pE=mapXY(tri[0].x,tri[0].y,b,w,h), pF=mapXY(tri[1].x,tri[1].y,b,w,h), pG=mapXY(tri[2].x,tri[2].y,b,w,h);
  const info='AB='+cfg.tate+'cm　BC='+cfg.yoko+'cm　EF='+cfg.takasa+'cm　FG='+cfg.tei+'cm　秒速='+cfg.hayasa+'cm';
  svg.innerHTML=''
    +'<rect x="0" y="0" width="760" height="360" rx="18" fill="transparent"/>'
    +'<polygon points="'+pointsStr(rect,b,w,h)+'" fill="rgba(46,134,222,.10)" stroke="#2E86DE" stroke-width="3"/>'
    +'<polygon points="'+pointsStr(tri,b,w,h)+'" fill="rgba(246,185,59,.35)" stroke="#D89A2C" stroke-width="3"/>'
    +(ov.length>=3?'<polygon points="'+pointsStr(ov,b,w,h)+'" fill="rgba(46,134,222,.28)" stroke="none"/>':'')
    +'<mask id="triMask"><rect width="100%" height="100%" fill="black"/><polygon points="'+pointsStr(ov,b,w,h)+'" fill="white"/></mask>'
    +'<polygon points="'+pointsStr(tri,b,w,h)+'" fill="rgba(234,80,64,.58)" mask="url(#triMask)"/>'
    +label('A',pA,-24,-8)+label('B',pB,-24,22)+label('C',pC,8,22)+label('D',pD,8,-8)
    +label('E',pE,-22,-8)+label('F',pF,-20,22)+label('G',pG,8,22)
    +'<text x="26" y="28" font-size="17" font-weight="900" fill="#0E6F6B">'+info+'</text>';
}

function clearTrail(){ S.trail=[]; }
/* 点が 通った ところを 記録する（グラフを 表示している あいだ だけ） */
function recordTrail(){
  if(!S.showGraph) return;
  const key=Math.round(S.t*100)/100, y=remainArea(S.cfg,S.t);
  if(!S.trail.some(q=>Math.abs(q.x-key)<1e-9)) S.trail.push({x:key,y:y});
}
function drawGraph(){
  const svg=$('graphSvg'), w=760, h=300, p=40, cfg=S.cfg;
  const te=tEnd(cfg), total=triArea(cfg);
  const map=(x,y)=>({x:p + x/Math.max(te,0.1)*(w-2*p), y:h-p - y/Math.max(total,1)*(h-2*p)});
  let grids='';
  for(let i=0;i<=6;i++){
    const gy=p + i*(h-2*p)/6;
    const val=((6-i)/6*total);
    grids += '<line x1="'+p+'" y1="'+gy+'" x2="'+(w-p)+'" y2="'+gy+'" stroke="#E9D9C4" stroke-dasharray="4 4"/>'
      +'<text x="8" y="'+(gy+5)+'" font-size="12" fill="#6B7A84">'+fmt(val)+'</text>';
  }
  for(let i=0;i<=6;i++){
    const gx=p + i*(w-2*p)/6;
    const val=(i/6*te);
    grids += '<line x1="'+gx+'" y1="'+p+'" x2="'+gx+'" y2="'+(h-p)+'" stroke="#F0E4D4" stroke-dasharray="4 4"/>'
      +'<text x="'+(gx-8)+'" y="'+(h-10)+'" font-size="12" fill="#6B7A84">'+fmt(val)+'</text>';
  }
  /* 通った ところだけ 線を つなぐ（はじめは 何も ない） */
  const tr=S.trail.slice().sort((a,b)=>a.x-b.x);
  let path='';
  tr.forEach((q,i)=>{ const m=map(q.x,q.y); path+=(i?' L ':'M ')+m.x.toFixed(2)+' '+m.y.toFixed(2); });
  const marks=tr.map(q=>{ const m=map(q.x,q.y); return '<circle cx="'+m.x.toFixed(1)+'" cy="'+m.y.toFixed(1)+'" r="2" fill="#EA5040" opacity=".55"/>'; }).join('');
  const cur=map(S.t,remainArea(cfg,S.t));
  svg.innerHTML=''
    +'<rect x="0" y="0" width="760" height="300" rx="18" fill="transparent"/>'
    +grids
    +'<line x1="'+p+'" y1="'+(h-p)+'" x2="'+(w-p)+'" y2="'+(h-p)+'" stroke="#37424A" stroke-width="2"/>'
    +'<line x1="'+p+'" y1="'+p+'" x2="'+p+'" y2="'+(h-p)+'" stroke="#37424A" stroke-width="2"/>'
    +(tr.length>1?'<path d="'+path+'" fill="none" stroke="#EA5040" stroke-width="4" stroke-linecap="round"/>':'')
    +marks
    +'<circle cx="'+cur.x+'" cy="'+cur.y+'" r="7" fill="#19A199" stroke="#fff" stroke-width="2"/>'
    +'<text x="'+(w-26)+'" y="'+(h-p-12)+'" text-anchor="end" font-size="16" font-weight="900" fill="#37424A">x（秒）</text>'
    +'<text x="18" y="24" font-size="16" font-weight="900" fill="#37424A">y（cm²）</text>'
    +(tr.length<2?'<text x="'+(w/2)+'" y="'+(h/2)+'" text-anchor="middle" font-size="16" font-weight="900" fill="#B9C3C0">「再生」すると 点の 跡が のこります</text>':'');
}
/* 表：横向き 2行（上が x、下が y）。点が とおった ところから 数が 出る */
function tableXs(cfg){
  const te=tEnd(cfg), xs=[];
  for(let x=0;x<=te+1e-9;x+=1) xs.push(Math.round(x*1000)/1000);
  if(Math.abs(xs[xs.length-1]-te)>1e-9) xs.push(Math.round(te*1000)/1000);
  return xs;
}
function drawTable(){
  const cfg=S.cfg, xs=tableXs(cfg);
  let near=0, best=Infinity;
  xs.forEach((x,i)=>{ const d=Math.abs(x-S.t); if(d<best){best=d;near=i;} });
  let r1='<tr><th>x（秒）</th>', r2='<tr><th>y（cm²）</th>';
  xs.forEach((x,i)=>{
    const on=(S.t>=x-1e-9), cls=(i===near?' class="now"':'');
    r1+='<td'+cls+'>'+fmt(x)+'</td>';
    r2+='<td'+cls+'>'+(on?fmt(remainArea(cfg,x)):'―')+'</td>';
  });
  $('valTable').innerHTML=r1+'</tr>'+r2+'</tr>';
}
function updateStats(){
  const cfg=S.cfg;
  $('tNow').textContent=fmt(S.t);
  $('aNow').textContent=fmt(remainArea(cfg,S.t));
  $('aFull').textContent=fmt(triArea(cfg));
  $('tEndTxt').textContent=fmt(tEnd(cfg));
  $('timeSlider').max=String(tEnd(cfg));
  $('timeSlider').value=String(S.t);
  $('noteBox').innerHTML=noteText(cfg);
}
/* 説明と 式 */
function noteText(cfg){
  const te=fmt(tEnd(cfg)), a=cfg.hayasa*cfg.hayasa/2, total=fmt(triArea(cfg));
  let h='ヒント：<b>x</b> は時間、<b>y</b> は「三角形のうち正方形の外にある面積」です。<br>'
       +'三角形は <b>点Fが点Bにかさなるところ</b>（x＝'+te+'秒）まで右へ動きます。';
  if(cfg.tei<=cfg.yoko){
    h+='<br>正方形に入った部分は「速さ×x」を1辺とする直角二等辺三角形なので、<br>'
      +'<b>y ＝ '+total+' － '+(a===1?'':fmt(a))+'x<sup>2</sup></b>　（0 ≦ x ≦ '+te+'）';
  }
  return h;
}

function render(){ recordTrail(); drawGeometry(); if(S.showGraph) drawGraph(); if(S.showTable) drawTable(); updateStats(); }
function apply(){
  const hen=Math.round(num('hen',3,10)), leg=Math.round(num('leg',2,10)), hy=Math.round(num('hayasa',1,5));
  S.cfg=makeCfg(hen,leg,hy);
  $('hen').value=hen; $('leg').value=leg; $('hayasa').value=hy;
  S.t=0; clearTrail(); render();
}
function play(){ S.playing=true; S.last=performance.now(); requestAnimationFrame(tick); }
function pause(){ S.playing=false; }
function reset(){ S.t=0; pause(); clearTrail(); render(); }
function tick(ts){
  if(!S.playing) return;
  const dt=(ts-S.last)/1000; S.last=ts;
  S.t = Math.min(tEnd(S.cfg), S.t + dt);
  render();
  if(S.t>=tEnd(S.cfg)){ S.playing=false; return; }
  requestAnimationFrame(tick);
}

$('applyBtn').addEventListener('click',apply);
$('playBtn').addEventListener('click',play);
$('pauseBtn').addEventListener('click',pause);
$('resetBtn').addEventListener('click',reset);
$('timeSlider').addEventListener('input',e=>{ pause(); S.t=parseFloat(e.target.value||'0'); render(); });
['hen','leg','hayasa'].forEach(id=>$(id).addEventListener('keydown',e=>{ if(e.key==='Enter') apply(); }));
['hen','leg','hayasa'].forEach(id=>$(id).addEventListener('change',apply));
$('swGraph').addEventListener('change',e=>{ S.showGraph=e.target.checked; $('graphPanel').style.display=S.showGraph?'block':'none'; clearTrail(); render(); });
